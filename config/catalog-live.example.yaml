# mango live TV rails — copy to /etc/mango/catalog-live.yaml on the Pi
#
# Curated free sports via mango Live Free M3U; AREA69 paid for live PPV events.
# AREA69 full-catalog rows (incl. FIFA World Cup live PPV) merge from area69-live-search.json.
# verify_streams: false avoids NexoTV /stream/ rate limits; disk cache at ~/.cache/mango/

version: 2
cache_ttl_sec: 1800
verify_streams: false

sources:
  - addon: mango Live TV
    label: AREA69
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live Free
    label: free
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live News
    label: news
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live Cartoons
    label: cartoons
    catalog: iptv_channels
    catalog_type: tv
    pages: 1

rails:
  - id: live-world-cup
    label: world cup
    limit: 8
    qualification: fifa_mens_world_cup
    source_fill:
      - addon: mango Live Free
        limit: 2
        keywords:
          - fifa
      - addon: mango Live TV
        limit: 8
        keywords:
          - world cup
          - fifa world cup
          - copa mundial
          - copa do mundo
          - copa mundial de la fifa
          - mundial de la fifa
          - todo el mundial
          - world cup tonight
          - world cup today
          - tsn at the world cup
          - dieciseisavos
          - octavos de final
          - cuartos de final
          - semifinal
          - bein sports max
        exclude_keywords:
          - soccer ppv
          - national pool
          - pool championship
          - phillies at
          - marlins at
          - mariners at
          - goodwood
          - road racing
          - nfl
          - baseball
          - mlb
          - cricket
    keywords:
      - world cup
      - fifa
      - copa mundial
      - copa do mundo
      - mundial
    exclude_keywords:
      - replay
      - 24/7
      - soccer ppv
      - national pool
      - pool championship
      - phillies at
      - marlins at
      - mariners at
      - goodwood
      - road racing
      - nfl
      - baseball
      - mlb
      - cricket

