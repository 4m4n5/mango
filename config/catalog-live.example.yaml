# mango live TV rails — copy to /etc/mango/catalog-live.yaml on the Pi
#
# Curated free sports via mango Live Free M3U; AREA69 paid for live PPV events.
# AREA69 full-catalog rows (incl. FIFA World Cup live PPV) merge from area69-live-search.json.
# verify_streams: false avoids NexoTV /stream/ rate limits; disk cache at ~/.cache/mango/

version: 2
cache_ttl_sec: 1800
verify_streams: false

sources:
  - addon: mango Live TV
    label: AREA69
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live Free
    label: free
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live News
    label: news
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live Cartoons
    label: cartoons
    catalog: iptv_channels
    catalog_type: tv
    pages: 1

rails:
  - id: live-cricket
    label: cricket
    limit: 48
    source_fill:
      - addon: mango Live TV
        limit: 40
        keywords:
          - cricket
          - ipl
          - willow
          - star sports
          - sky sports cricket
          - fox cricket
          - supersport cricket
          - sportsmax cricket
          - test match
          - t20
          - ashes
        exclude_keywords:
          - 24/7
          - replay
          - banana
          - baseball
          - soccer
      - addon: mango Live Free
        limit: 8
        keywords:
          - star sports
          - willow
          - dd sports
          - cricket gold
    keywords:
      - cricket
    exclude_keywords:
      - replay
      - 24/7
      - baseball

  - id: live-football
    label: football & soccer
    limit: 80
    source_fill:
      - addon: mango Live Free
        limit: 10
        keywords:
          - fifa
          - bein sports
          - star sports
      - addon: mango Live TV
        limit: 70
        keywords:
          - world cup
          - fifa
          - copa mundial
          - soccer ppv
          - football ppv
          - uefa
          - premier league
          - bundesliga
          - la liga
          - serie a
          - champions league
          - ligue 1
          - mls
          - bein sports
          - dazn
          - sky sports football
          - tnt sports
          - supersport football
        exclude_keywords:
          - prime video
          - tubi
          - sitcom
          - news
          - crime
          - movie
          - 24/7
          - replay
          - baseball
          - mlb
          - nba
          - nfl
    keywords:
      - football
      - soccer
      - fifa
      - world cup
    exclude_keywords:
      - replay
      - 24/7
      - darts
      - handball
      - combat
      - storm football
      - pluto
      - baseball
      - mlb
      - astros
      - yankees
      - cubs
      - dodgers
      - braves
      - nationals
      - indycar
      - necbl
      - pool championship
      - at orioles
      - at rays
      - at pirates
      - at mets
      - at rockies
      - at angels
      - at tigers
      - at white sox

  - id: live-racing
    label: racing
    limit: 32
    source_fill:
      - addon: mango Live TV
        limit: 24
        keywords:
          - f1
          - formula 1
          - formula one
          - sky sports f1
          - dazn f1
          - apple tv f1
          - f1 tv
          - viaplay f1
          - motorsport
          - motogp
          - nascar
          - indycar
        exclude_keywords:
          - tubi
          - 24/7
          - replay
          - horse
      - addon: mango Live Free
        limit: 8
        keywords:
          - fanduel racing
          - floracing
          - rally tv
          - sky racing
    keywords:
      - racing
      - f1
      - formula 1
    exclude_keywords:
      - replay
      - 24/7
      - news
      - horse

  - id: live-news
    label: news
    limit: 12
    source_fill:
      - addon: mango Live News
        limit: 12
        match_all: true
    keywords:
      - news
    exclude_keywords:
      - replay
      - sport

  - id: live-cartoons
    label: cartoons
    limit: 15
    source_fill:
      - addon: mango Live Cartoons
        limit: 15
        match_all: true
    keywords:
      - kids
    exclude_keywords:
      - replay
