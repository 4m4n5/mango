# mango live TV rails — copy to /etc/mango/catalog-live.yaml on the Pi
#
# Curated free sports via mango Live Free M3U; AREA69 paid for live PPV events.
# AREA69 full-catalog rows merge from area69-live-search.json.
# verify_streams: false avoids NexoTV /stream/ rate limits; disk cache at ~/.cache/mango/
# Browse rails: Indian cricket, Formula 1, news, cartoons (no World Cup / soccer shelves).

version: 2
cache_ttl_sec: 1800
verify_streams: false

sources:
  - addon: mango Live TV
    label: AREA69
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live Free
    label: free
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live News
    label: news
    catalog: iptv_channels
    catalog_type: tv
    pages: 1
  - addon: mango Live Cartoons
    label: cartoons
    catalog: iptv_channels
    catalog_type: tv
    pages: 1

rails:
  - id: live-cricket
    label: cricket
    limit: 12
    qualification: india_cricket
    source_fill:
      - addon: mango Live TV
        limit: 12
        keywords:
          - cricket
          - ipl
          - willow
          - star sports
          - dd sports
          - sony sports
          - test match
          - t20
          - india
        exclude_keywords:
          - 24/7
          - replay
          - banana
          - baseball
          - soccer
          - sky sports cricket
          - fox cricket
          - supersport cricket
          - sportsmax cricket
          - ashes
      - addon: mango Live Free
        limit: 8
        keywords:
          - star sports
          - willow
          - dd sports
          - cricket gold
    keywords:
      - cricket
      - india
    exclude_keywords:
      - replay
      - 24/7
      - baseball
      - sky sports cricket
      - fox cricket
      - ashes

  - id: live-racing
    label: formula 1
    limit: 8
    qualification: f1_standing_allowlist
    source_fill:
      - addon: mango Live TV
        limit: 8
        keywords:
          - f1
          - formula 1
          - formula one
          - sky sports f1
          - dazn f1
          - apple tv f1
          - f1 tv
          - viaplay f1
          - canal+ formula
          - canal+ f1
          - ant1+ formula
        exclude_keywords:
          - tubi
          - 24/7
          - replay
          - horse
          - nascar
          - indycar
          - motogp
          - moto gp
          - rally
          - floracing
          - fanduel
          - sky racing
          - nhra
          - drag
          - motocross
          - superbike
    keywords:
      - f1
      - formula 1
      - formula one
      - sky sports f1
    exclude_keywords:
      - replay
      - 24/7
      - news
      - horse
      - nascar
      - indycar
      - motogp
      - moto gp
      - rally
      - floracing
      - fanduel
      - sky racing
      - nhra
      - drag
      - motocross
      - superbike

  - id: live-news
    label: news
    limit: 12
    qualification: balanced_news
    source_fill:
      - addon: mango Live News
        limit: 8
        match_all: true
      - addon: mango Live TV
        limit: 4
        keywords:
          - bbc news
          - sky news
          - al jazeera english
          - nbc news now
    keywords:
      - news
    exclude_keywords:
      - replay
      - sport

  - id: live-cartoons
    label: cartoons
    limit: 12
    qualification: english_hindi_cartoons
    source_fill:
      - addon: mango Live Cartoons
        limit: 12
        match_all: true
    keywords:
      - kids
    exclude_keywords:
      - replay
